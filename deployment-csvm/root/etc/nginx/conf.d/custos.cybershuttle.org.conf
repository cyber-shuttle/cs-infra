# The Custos portal, plus Custos core's /me, which cs-plane resolves callers through.
server {
    listen 80;
    server_name custos.cybershuttle.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name custos.cybershuttle.org;
    ssl_certificate /etc/letsencrypt/live/csvm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvm/privkey.pem;
    location = /me {
        proxy_pass http://127.0.0.1:8100;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
