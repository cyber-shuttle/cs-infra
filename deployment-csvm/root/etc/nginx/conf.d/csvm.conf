# All three public names, served over one certificate. Every service behind them listens on loopback.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jupyter.cybershuttle.org jupyterapi.cybershuttle.org custos.cybershuttle.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jupyter.cybershuttle.org;
    ssl_certificate /etc/letsencrypt/live/csvm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvm/privkey.pem;
    root /var/www/jupyter.cybershuttle.org;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jupyterapi.cybershuttle.org;
    ssl_certificate /etc/letsencrypt/live/csvm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvm/privkey.pem;
    # The SSH-auth WebSocket carries the bearer in Sec-WebSocket-Protocol, past nginx's 8k default.
    large_client_header_buffers 4 64k;
    location / {
        proxy_pass http://127.0.0.1:8045;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name custos.cybershuttle.org;
    ssl_certificate /etc/letsencrypt/live/csvm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvm/privkey.pem;
    # csctl resolves callers through Custos core's /me; everything else is the portal.
    location = /me {
        proxy_pass http://127.0.0.1:8100;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
