# The static CyberShuttle Jupyter site: cs-jupyter's built dist/, copied here by up.sh.
server {
    listen 80;
    server_name jupyter.cybershuttle.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jupyter.cybershuttle.org;
    ssl_certificate /etc/letsencrypt/live/csvm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvm/privkey.pem;
    root /var/www/jupyter.cybershuttle.org;
}
